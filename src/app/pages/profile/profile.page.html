<ion-header>
  <ion-toolbar>
    <ion-title>Mon profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (isLoading()) {
    <div class="ion-text-center">
      <ion-spinner></ion-spinner>
    </div>
  } @else if (errorMessage()) {
    <ion-text color="danger"><p>{{ errorMessage() }}</p></ion-text>
    <ion-button routerLink="/home">Retour</ion-button>
  } @else if (profile(); as p) {
    <ion-card>
      <ion-card-content>
        <ion-item><ion-label>Prénom : {{ p.firstName }}</ion-label></ion-item>
        <ion-item><ion-label>Nom : {{ p.lastName }}</ion-label></ion-item>
        <ion-item><ion-label>Email : {{ p.email }}</ion-label></ion-item>
        <ion-item><ion-label>Âge : {{ p.age }}</ion-label></ion-item>
        <ion-item><ion-label>Rôle : {{ p.role }}</ion-label></ion-item>
        <ion-item><ion-label>Statut : {{ p.active ? 'Actif' : 'Désactivé' }}</ion-label></ion-item>
      </ion-card-content>
    </ion-card>

    <ion-button expand="block" color="danger" (click)="logout()" [disabled]="isLoggingOut()">
      Se déconnecter
    </ion-button>
  }
</ion-content>
