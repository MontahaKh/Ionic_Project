<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gestion des films</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gestion des films</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item><ion-label position="stacked">Titre</ion-label><ion-input [(ngModel)]="title"></ion-input></ion-item>
  <ion-item><ion-label position="stacked">Synopsis</ion-label><ion-input [(ngModel)]="overview"></ion-input></ion-item>
  <ion-item><ion-label position="stacked">Date de sortie</ion-label><ion-input type="date" [(ngModel)]="releaseDate"></ion-input></ion-item>
  <ion-item><ion-label position="stacked">URL de l'affiche</ion-label><ion-input [(ngModel)]="posterPath"></ion-input></ion-item>
  <ion-item><ion-label position="stacked">Genres séparés par des virgules</ion-label><ion-input [(ngModel)]="genresText"></ion-input></ion-item>
  <ion-button expand="block" [disabled]="isSaving" (click)="addMovie()">Ajouter le film</ion-button>
  <ion-text color="danger" *ngIf="errorMessage"><p>{{ errorMessage }}</p></ion-text>
  <ion-list *ngIf="!isLoading">
    <ion-item *ngFor="let movie of movies">
      <ion-label><h2>{{ movie.title }}</h2><p>{{ movie.overview }}</p></ion-label>
      <ion-button slot="end" color="danger" (click)="deleteMovie(movie)">Supprimer</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
